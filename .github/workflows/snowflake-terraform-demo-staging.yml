
name: "STAGING ENV: Snowflake Terraform Demo Workflow"

on: 
  push:
    branches: 
      - staging

jobs:
  deploy-terraform-staging:
    name: "Plan & Deploy Terraform plan on Staging"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      
      - name: Terraform Init
        id: init
        run: terraform -chdir=./staging init

      - name: Terraform Format
        id: fmt
        run: terraform -chdir=./staging fmt -recursive -check

      - name: Terraform Validate
        id: validate
        run: terraform -chdir=./staging validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform -chdir=./staging plan
        env:
          TF_VAR_snowflake_private_key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Terraform Apply
        id: apply
        run: terraform -chdir=./staging apply -auto-approve
        env:
          TF_VAR_snowflake_private_key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      # ✅ Commit Terraform state file to repo
      - name: Commit Terraform state
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add staging/terraform.tfstate staging/terraform.tfstate.backup || echo "No state file found"
          git commit -m "Update Terraform state for staging" || echo "No changes to commit"
          git push
